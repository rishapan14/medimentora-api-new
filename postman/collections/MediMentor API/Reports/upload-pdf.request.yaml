$kind: http-request
name: 'Upload PDF Report'
method: POST
url: '{{baseUrl}}/api/reports/upload/pdf'
order: 1000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
body:
  type: formdata
  content:
    - key: file
      type: file
      src: '/path/to/report.pdf'
      description: 'PDF report file (required)'
    - key: title
      type: text
      value: 'CBC Blood Test Report'
      description: 'Report title (optional, defaults to Medical Report)'

$kind: http-request
name: 'Add Comment'
method: POST
url: '{{baseUrl}}/api/discussions/{{discussionId}}/comments'
order: 6000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "content": "We use a sliding scale insulin protocol with target glucose 140-180 mg/dL for most ICU patients.",
      "parent_id": null
    }

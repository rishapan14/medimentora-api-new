$kind: http-request
name: 'Reply to Comment'
method: POST
url: '{{baseUrl}}/api/discussions/{{discussionId}}/comments'
order: 7000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "content": "Agreed! We also monitor for hypoglycemia every 2 hours.",
      "parent_id": {{commentId}}
    }

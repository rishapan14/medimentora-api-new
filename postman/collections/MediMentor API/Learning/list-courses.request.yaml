$kind: http-request
name: 'List Courses'
method: GET
url: '{{baseUrl}}/api/learning/courses'
order: 1000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
queryParams:
  - key: speciality
    value: Nursing
    description: 'Filter by speciality (optional)'
    disabled: true
  - key: difficulty
    value: easy
    description: 'Filter by difficulty: easy, medium, hard (optional)'
    disabled: true

$kind: http-request
name: 'Update Profile'
method: PUT
url: '{{baseUrl}}/api/auth/profile'
order: 7000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "full_name": "Alex Student Updated",
      "speciality": "Cardiology"
    }
